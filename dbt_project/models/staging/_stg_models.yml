version: 2

models:
  - name: stg_customers
    description: Cleaned and renamed customers from the raw seed source.
    columns:
      - name: customer_id
        description: Primary key.
        tests:
          - not_null
          - unique
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: full_name
        description: Concatenation of first_name and last_name.
      - name: email
        description: Customer email address.
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: Cleaned and renamed orders from the raw seed source.
    columns:
      - name: order_id
        description: Primary key.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Foreign key to stg_customers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        tests:
          - not_null
      - name: order_status
        description: "Order fulfillment status."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["completed", "shipped", "returned", "return_pending", "placed"]

  - name: stg_payments
    description: Cleaned and renamed payments from the raw seed source.
    columns:
      - name: payment_id
        description: Primary key.
        tests:
          - not_null
          - unique
      - name: order_id
        description: Foreign key to stg_orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        description: Method used to pay.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["credit_card", "bank_transfer", "coupon", "gift_card"]
      - name: amount_cents
        description: Payment amount in cents (integer).
        tests:
          - not_null
      - name: amount
        description: Payment amount in USD.
        tests:
          - not_null
