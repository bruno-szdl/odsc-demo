version: 2

models:
  - name: stg_customers
    description: Cleaned and renamed customers from the raw seed source.
    columns:
      - name: customer_id
        description: Primary key.
        tests:
          - not_null
          - unique
      - name: full_name
        description: Concatenation of first_name and last_name.
      - name: email
        description: Customer email address.
        tests:
          - not_null
          - unique
      - name: created_date
        description: Date the customer account was created.

  - name: stg_orders
    description: Cleaned and renamed orders from the raw seed source.
    columns:
      - name: order_id
        description: Primary key.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Foreign key to stg_customers.
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        description: Date the order was placed.
        tests:
          - not_null
      - name: status
        description: "Order fulfillment status. One of: completed, shipped, returned."
        tests:
          - not_null
          - accepted_values:
              values: ["completed", "shipped", "returned"]
      - name: amount
        description: Order value in USD.
        tests:
          - not_null
